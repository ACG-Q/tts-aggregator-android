name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 appVersionName"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::tag $TAG 与代码中的版本 $VERSION 不一致，请先运行 scripts/release.ps1"
              exit 1
            fi
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Pulse-v${{ steps.version.outputs.name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v${{ steps.version.outputs.name }}
          path: Pulse-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pulse-v${{ steps.version.outputs.name }}.apk
          name: Pulse v${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
