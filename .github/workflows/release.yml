name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 appVersionName"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::tag $TAG 与代码中的版本 $VERSION 不一致，请先运行 scripts/release.ps1"
              exit 1
            fi
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signatures
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          COUNT=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "::error::预期 5 个 release APK，实际 $COUNT 个"
            ls -l "$APK_DIR"
            exit 1
          fi
          for APK in "$APK_DIR"/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          done

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          for ABI in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            SRC="$APK_DIR/app-${ABI}-release.apk"
            if [ ! -f "$SRC" ]; then
              echo "::error::缺少 $SRC"
              exit 1
            fi
            cp "$SRC" "Pulse-v${VERSION}-${ABI}.apk"
          done
          ls -l Pulse-v${VERSION}-*.apk

      - name: Compute release range
        id: meta
        env:
          VERSION: ${{ steps.version.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags --force origin > /dev/null 2>&1 || true
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            TARGET=$(git rev-parse "refs/tags/${TAG}^{commit}")
          else
            TARGET=$(git rev-parse HEAD)
          fi
          ROOT=$(git rev-list --max-parents=0 "${TARGET}" | tail -n 1)
          PREV=$(git describe --tags --abbrev=0 --match "v[0-9]*" "${TARGET}^" 2>/dev/null || true)

          # 上一个 Release 不是分类格式（或没有上一个版本）时，用全量历史补齐
          FULL=false
          if [ -z "$PREV" ]; then
            FULL=true
          else
            PREV_BODY=$(gh release view "$PREV" --json body --jq .body 2>/dev/null || true)
            if ! printf '%s' "$PREV_BODY" | grep -q '### 更新内容'; then
              FULL=true
            fi
          fi

          if [ "$FULL" = true ]; then
            RANGE="${ROOT}..${TARGET}"
            LOG_RANGE="${ROOT}..${TARGET}"
            DIFF_BASE="${ROOT}"
            LINK="**完整提交记录**：https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            IGNORE_TAGS="--ignore-tags v*"
            echo "使用全量范围：${ROOT}..${TARGET}"
          else
            RANGE="${PREV}..${TARGET}"
            LOG_RANGE="${PREV}..${TARGET}"
            DIFF_BASE="${PREV}"
            LINK="**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            IGNORE_TAGS=""
            echo "使用增量范围：${PREV}..${TARGET}"
          fi

          {
            echo "tag=${TAG}"
            echo "target=${TARGET}"
            echo "prev=${PREV}"
            echo "range=${RANGE}"
            echo "log_range=${LOG_RANGE}"
            echo "diff_base=${DIFF_BASE}"
            echo "ignore_tags=${IGNORE_TAGS}"
            echo "link=${LINK}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate categorized changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: ${{ steps.meta.outputs.range }} ${{ steps.meta.outputs.ignore_tags }} --output changelog.md

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ steps.meta.outputs.target }}
          LOG_RANGE: ${{ steps.meta.outputs.log_range }}
          DIFF_BASE: ${{ steps.meta.outputs.diff_base }}
          LINK: ${{ steps.meta.outputs.link }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "$VERSION"
          VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          : > download-rows.md
          for ABI in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            APK="Pulse-${TAG}-${ABI}.apk"
            BYTES=$(stat -c%s "$APK")
            SIZE=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')
            SHA=$(sha256sum "$APK" | awk '{print $1}')
            sha256sum "$APK" > "${APK}.sha256"
            printf '| `%s` | %s | %s | `%s` |\n' "$APK" "$ABI" "$SIZE" "$SHA" >> download-rows.md
          done

          COMMIT_COUNT=$(git log --no-merges --pretty=format:%s "${LOG_RANGE}" | grep -vc '^chore: 发布' || true)
          FILE_COUNT=$(git diff --name-only "${DIFF_BASE}" "${TARGET}" | wc -l)
          SHORTSTAT=$(git diff --shortstat "${DIFF_BASE}" "${TARGET}" || true)
          ADDED=$(git diff --name-status --diff-filter=A "${DIFF_BASE}" "${TARGET}" | awk -F'\t' '{print $2}')
          MODIFIED=$(git diff --name-status --diff-filter=M "${DIFF_BASE}" "${TARGET}" | awk -F'\t' '{print $2}')
          RENAMED=$(git diff --name-status --diff-filter=R "${DIFF_BASE}" "${TARGET}" | awk -F'\t' '{print $3}')
          DELETED=$(git diff --name-status --diff-filter=D "${DIFF_BASE}" "${TARGET}" | awk -F'\t' '{print $2}')

          format_list() { sed 's/.*/- `&`/'; }

          CHANGELOG=$(sed -e '/./,$!d' changelog.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 本次发布没有代码变更"
          fi

          {
            echo "## Pulse ${TAG}"
            echo
            echo "Android 8.0+ · 已签名 APK"
            echo
            echo "### 更新内容"
            echo
            echo "$CHANGELOG"
            echo
            echo "### 变更统计"
            echo
            echo "- 提交：${COMMIT_COUNT} 个"
            echo "- 文件：${FILE_COUNT} 个"
            if [ -n "$SHORTSTAT" ]; then
              echo "- 代码：${SHORTSTAT#*, }"
            fi
            echo
            if [ -n "$ADDED$MODIFIED$RENAMED$DELETED" ]; then
              echo "<details>"
              echo "<summary>文件明细（${FILE_COUNT} 个）</summary>"
              echo
              if [ -n "$ADDED" ]; then
                echo "**新增**"
                echo
                printf '%s\n' "$ADDED" | format_list
                echo
              fi
              if [ -n "$MODIFIED" ]; then
                echo "**修改**"
                echo
                printf '%s\n' "$MODIFIED" | format_list
                echo
              fi
              if [ -n "$RENAMED" ]; then
                echo "**重命名**"
                echo
                printf '%s\n' "$RENAMED" | format_list
                echo
              fi
              if [ -n "$DELETED" ]; then
                echo "**删除**"
                echo
                printf '%s\n' "$DELETED" | format_list
                echo
              fi
              echo "</details>"
              echo
            fi
            echo "### 下载"
            echo
            echo "| 文件 | ABI | 大小 | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            cat download-rows.md
            echo
            echo "大多数手机选 \`arm64-v8a\`；不确定架构时使用 \`universal\`（体积更大，兼容全部）。"
            echo
            echo "### 版本信息"
            echo
            echo "- versionName：${VERSION}"
            echo "- versionCode：${VERSION_CODE}"
            echo "- 最低系统：Android 8.0（API 26）"
            echo
            echo "下载 APK 后，在系统设置中允许「安装未知来源应用」即可安装；已有版本可直接覆盖升级，无需卸载。"
            echo
            echo "$LINK"
          } > release-notes.md

          cat release-notes.md

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "$VERSION"
          export VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version_code = int(os.environ["VERSION_CODE"])

          min_supported = 0
          if os.path.exists("update-policy.json"):
              with open("update-policy.json", encoding="utf-8-sig") as f:
                  min_supported = int(json.load(f).get("minSupportedVersionCode", 0) or 0)
          if min_supported < 0 or min_supported > version_code:
              raise SystemExit(
                  f"update-policy.json 的 minSupportedVersionCode={min_supported} "
                  f"必须在 0..{version_code} 之间"
              )

          abis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64", "universal"]
          apks = {}
          sha256 = {}
          for abi in abis:
              apk = f"Pulse-v{version}-{abi}.apk"
              if not os.path.exists(apk) or not os.path.exists(f"{apk}.sha256"):
                  raise SystemExit(f"缺少 {apk} 或其校验文件")
              apks[abi] = f"https://github.com/{repo}/releases/download/{tag}/{apk}"
              with open(f"{apk}.sha256", encoding="utf-8") as f:
                  sha256[abi] = f.read().split()[0]

          notes = ""
          if os.path.exists("changelog.md"):
              with open("changelog.md", encoding="utf-8") as f:
                  notes = f.read().strip()

          data = {
              "versionName": version,
              "versionCode": version_code,
              "minSupportedVersionCode": min_supported,
              "releasePage": f"https://github.com/{repo}/releases/tag/{tag}",
              "notes": notes,
              "apks": apks,
              "sha256": sha256,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v${{ steps.version.outputs.name }}
          path: |
            Pulse-v${{ steps.version.outputs.name }}-*.apk
            Pulse-v${{ steps.version.outputs.name }}-*.apk.sha256
            update.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulse-v${{ steps.version.outputs.name }}-*.apk
            Pulse-v${{ steps.version.outputs.name }}-*.apk.sha256
            update.json
          name: Pulse v${{ steps.version.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

      - name: Refresh release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes-file release-notes.md
          echo "已刷新 ${TAG} 的 Release 正文"
